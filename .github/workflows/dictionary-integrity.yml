name: Dictionary integrity

on:
  push:
    paths:
      - "termbase.v2.json"
      - "termbase.index.json"
      - "termbase/**"
      - "scripts/audit-dictionary-integrity.py"
  pull_request:
    paths:
      - "termbase.v2.json"
      - "termbase.index.json"
      - "termbase/**"
      - "scripts/audit-dictionary-integrity.py"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit-dictionary-integrity.py
